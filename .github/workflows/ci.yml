name: SenkuVim CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 valgrind

    - name: Build Release Binary (${{ matrix.compiler }})
      run: |
        make clean
        make CC=${{ matrix.compiler }}

    - name: Run Native Unity Unit Tests
      run: |
        make clean
        make unit-test CC=${{ matrix.compiler }}

    - name: Run Unit Tests with AddressSanitizer & UBSan
      run: |
        make clean
        make unit-test-asan CC=${{ matrix.compiler }}

    - name: Run PTY Integration Tests Under ASan
      run: |
        make clean
        make asan CC=${{ matrix.compiler }}
        ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 python3 test_senkuvim.py
